name: CI

on:
  push:
    branches:
      - main
      - p06-secure-coding
      - p07-container-hardening
  pull_request:
    branches:
      - main

jobs:
  lint:
    name: Lint and Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run ruff
        run: ruff check .

      - name: Run black
        run: black --check .

      - name: Run isort
        run: isort --check-only .

      - name: Run mypy
        continue-on-error: true
        run: mypy app/

      - name: Run bandit
        continue-on-error: true
        run: bandit -r app -f json -o bandit-report.json

      - name: Upload Bandit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-report
          path: bandit-report.json


  test:
    name: Test and Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run pytest with coverage
        run: |
          pytest --cov=app --cov-report xml --cov-report term

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        continue-on-error: true
        with:
          file: coverage.xml
          fail_ci_if_error: false


  docker-lint:
    name: Dockerfile Lint (Hadolint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          format: sarif
          output-file: hadolint-results.sarif
        continue-on-error: true

      - name: Upload Hadolint report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hadolint-report
          path: hadolint-results.sarif


  container-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t secdev-app:latest .


  container-scan:
    name: Container Security Scan (Trivy)
    runs-on: ubuntu-latest
    needs: container-build
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t secdev-app:latest .

      - name: Run Trivy (image)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'secdev-app:latest'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        continue-on-error: true
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: 0

      - name: Generate Trivy JSON Report
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'secdev-app:latest'
          format: json
          output: trivy-report.json

      - name: Upload Trivy JSON report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-report
          path: trivy-report.json


  container-test:
    name: Container Tests (Runtime checks)
    runs-on: ubuntu-latest
    needs: container-build
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t secdev-app:latest .

      - name: Verify non-root user
        run: |
          USER_ID=$(docker run --rm --entrypoint "" secdev-app:latest id -u)
          echo "User ID: $USER_ID"
          if [ "$USER_ID" = "0" ]; then
            echo "❌ Container runs as root!"
            exit 1
          else
            echo "✅ Container runs as non-root (UID=$USER_ID)"
          fi

      - name: Test healthcheck endpoint
        run: |
          docker run -d --name test-container -p 8000:8000 secdev-app:latest
          sleep 10
          curl -f http://localhost:8000/health
          docker stop test-container
          docker rm test-container
