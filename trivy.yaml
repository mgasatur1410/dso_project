# Trivy конфигурация для проекта DSO (P07 C4 2**)
# Настраиваем строгость сканирования, игнорируемые уязвимости

# Уровни серьезности для фильтрации
severity:
  - CRITICAL
  - HIGH
  - MEDIUM

# Типы уязвимостей для проверки
vuln-type:
  - os
  - library

# Игнорируемые CVE с обоснованием (пример)
# Раскомментируйте и добавьте актуальные CVE по необходимости
# ignoredVulnerabilities:
#   - id: CVE-2023-12345
#     reason: "Ложное срабатывание - пакет используется только в dev окружении"
#   - id: CVE-2023-67890
#     reason: "Уязвимость не применима к нашему use-case, патч недоступен"

# Игнорирование уязвимостей с истёкшим сроком (незафиксированные)
ignore-unfixed: false

# Таймаут для сканирования (секунды)
timeout: 10m

# Игнорируемые пути (не сканировать)
skip-dirs:
  - "**/.venv/**"
  - "**/node_modules/**"
  - "**/test/**"
  - "**/.git/**"
  - "**/htmlcov/**"
  - "**/__pycache__/**"

# Игнорируемые файлы
skip-files:
  - "**/*.md"
  - "**/*.txt"
  - "**/LICENSE"

# Включить проверку секретов
scanners:
  - vuln
  - secret
  - config

# Настройки для секретов
secret:
  config: .trivysecret.yaml

# Ограничение ресурсов (опционально)
# cache:
#   dir: .trivy-cache

# Exit code (0 = не падать при уязвимостях, 1 = падать)
# Для CI лучше оставить exit-code: 1 после исправления критичных уязвимостей
# exit-code: 1
