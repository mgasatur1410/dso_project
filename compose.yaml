services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: secdev-app:latest
    container_name: secdev-app
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    # Security hardening: ограничение capabilities
    cap_drop:
      - ALL
    # Security hardening: read-only файловая система (кроме tmpfs)
    read_only: true
    tmpfs:
      - /tmp
      - /app/uploads
    # Security hardening: запуск под non-root пользователем
    user: "1000:1000"
    # Security hardening: запрет на получение новых привилегий
    security_opt:
      - no-new-privileges:true
      # AppArmor профиль (требует установки на хосте)
      # Установка: sudo apparmor_parser -r -W apparmor/docker-secdev-app
      - apparmor=docker-secdev-app
      # Seccomp профиль (ограничение syscalls)
      - seccomp=./seccomp.json
    restart: unless-stopped
    networks:
      - secdev-network

  # Пример расширения: PostgreSQL для будущего использования
