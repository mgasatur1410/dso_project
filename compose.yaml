  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   networks:
  #     - secdev-network
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U secdev_user"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

  # Пример расширения: Redis для кеширования
  # Раскомментируйте при необходимости кеша
  # redis:
