name: Security - SAST & Secrets

on:
  workflow_dispatch:
  push:
    paths:
      - "**/*.py"
      - "**/*.yaml"
      - "**/*.yml"
      - "security/**"
      - ".github/workflows/ci-sast-secrets.yml"
      - "Dockerfile"
      - "compose.yaml"
  pull_request:
    branches:
      - main
    paths:
      - "**/*.py"
      - "**/*.yaml"
      - "**/*.yml"
      - "security/**"
      - ".github/workflows/ci-sast-secrets.yml"
      - "Dockerfile"
      - "compose.yaml"

concurrency:
  group: sast-secrets-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  sast-secrets:
    name: Security - SAST & Secrets
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare evidence directories
        run: |
          mkdir -p EVIDENCE/P10
          mkdir -p security/semgrep

      - name: Run Semgrep (p/ci + project rules)
        timeout-minutes: 10
        continue-on-error: true
        run: |
          docker run --rm \
            -v "${PWD}:/src" \
            returntocorp/semgrep:1.92.0 \
            semgrep ci \
              --config p/ci \
              --config /src/security/semgrep/rules.yml \
              --metrics=off \
              --sarif \
              --output /src/EVIDENCE/P10/semgrep.sarif

      - name: Upload Semgrep SARIF to Code Scanning
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: EVIDENCE/P10/semgrep.sarif

      - name: Run Gitleaks (working tree)
        timeout-minutes: 8
        continue-on-error: true
        run: |
          docker run --rm \
            -v "${PWD}:/repo" \
            zricethezav/gitleaks:8.18.4 \
            detect --no-banner \
            --config=/repo/security/.gitleaks.toml \
            --source=/repo \
            --report-format=json \
            --report-path=/repo/EVIDENCE/P10/gitleaks.json

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p10-sast-secrets-${{ github.sha }}
          path: |
            EVIDENCE/P10/semgrep.sarif
            EVIDENCE/P10/gitleaks.json
            security/semgrep/rules.yml
            security/.gitleaks.toml
          retention-days: 60
