name: Security - IaC & Container (P12)

on:
  workflow_dispatch:
  push:
    paths:
      - "Dockerfile"
      - "iac/**"
      - "security/**"
      - "EVIDENCE/P12/**"
      - ".github/workflows/ci-p12-iac-container.yml"

concurrency:
  group: p12-iac-container-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  iac-container-security:
    name: Hadolint + Checkov + Trivy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare P12 evidence directory
        run: mkdir -p EVIDENCE/P12

      - name: Run Hadolint on Dockerfile
        run: |
          docker run --rm -i \
            -v "${PWD}:/workspace" \
            -w /workspace \
            hadolint/hadolint:latest-debian \
            hadolint --format json --config security/hadolint.yaml Dockerfile \
            > EVIDENCE/P12/hadolint_report.json || true

      - name: Build image for Trivy
        run: docker build -t secdev-app:local .

      - name: Run Checkov on IaC
        run: |
          docker run --rm \
            -v "${PWD}:/workspace" \
            -w /workspace \
            bridgecrew/checkov:latest \
            -d iac \
            -o json \
            --config-file security/checkov.yaml \
            > EVIDENCE/P12/checkov_report.json || true

      - name: Run Trivy on image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "secdev-app:local"
          format: "json"
          output: "EVIDENCE/P12/trivy_report.json"
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH,MEDIUM"
          timeout: "10m"

      - name: Upload P12 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p12-iac-container-${{ github.sha }}
          path: EVIDENCE/P12/
          retention-days: 30
