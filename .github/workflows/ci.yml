name: CI/CD

on:
  push:
    branches:
      - main
      - p08-cicd-minimal
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: 1

jobs:
  lint:
    name: Lint and Format (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        os: [ubuntu-latest]

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements*.txt', 'pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dev dependencies
        timeout-minutes: 5
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
        env:
          DB_URL: ${{ secrets.DB_URL_DEV }}
          JWT_SECRET: ${{ secrets.JWT_SECRET_DEV }}

      - name: Create reports directory
        run: mkdir -p reports

      - name: Run ruff
        timeout-minutes: 3
        run: |
          ruff check . --output-format=json > reports/ruff-report.json || true
          ruff check . || true

      - name: Generate ruff HTML report
        timeout-minutes: 1
        run: |
          python scripts/generate_ruff_html.py reports/ruff-report.json reports/ruff-report.html || true

      - name: Run black (check)
        timeout-minutes: 2
        run: black --check . || true

      - name: Run isort (check)
        timeout-minutes: 2
        run: isort --check-only . || true

      - name: Run mypy
        timeout-minutes: 5
        continue-on-error: true
        run: |
          mypy app/ --html-report reports/mypy-report || true

      - name: Run bandit
        timeout-minutes: 3
        continue-on-error: true
        run: |
          bandit -r app -f json -o reports/bandit-report.json || true
          bandit -r app -f html -o reports/bandit-report.html || true

      - name: Upload lint artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-reports-py${{ matrix.python-version }}-${{ matrix.os }}
          path: reports/
          retention-days: 30

  test:
    name: Test and Coverage (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        os: [ubuntu-latest]

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements*.txt', 'pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        timeout-minutes: 5
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
        env:
          DB_URL: ${{ secrets.DB_URL_DEV }}
          JWT_SECRET: ${{ secrets.JWT_SECRET_DEV }}

      - name: Create reports directory
        run: mkdir -p reports

      - name: Run pytest with coverage
        timeout-minutes: 10
        run: |
          pytest \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=html:reports/htmlcov \
            --cov-report=xml:reports/coverage.xml \
            --junit-xml=reports/junit.xml \
            --verbose
        env:
          DB_URL: ${{ secrets.DB_URL_DEV }}

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports-py${{ matrix.python-version }}-${{ matrix.os }}
          path: |
            reports/htmlcov/
            reports/coverage.xml
            reports/junit.xml
          retention-days: 30

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        continue-on-error: true
        with:
          file: reports/coverage.xml
          fail_ci_if_error: false

  docker-lint:
    name: Dockerfile Lint (Hadolint)
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Create reports directory
        run: mkdir -p reports

      - name: Run Hadolint (with custom config)
        timeout-minutes: 5
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          format: sarif
          output-file: reports/hadolint-results.sarif
          config: .hadolint.yaml
        continue-on-error: true

      - name: Upload Hadolint report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hadolint-report
          path: reports/hadolint-results.sarif
          retention-days: 30

  container-build:
    name: Build Docker Image
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build image
        timeout-minutes: 15
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: secdev-app:latest
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache,mode=max

  container-scan:
    name: Container Security Scan (Trivy)
    runs-on: ubuntu-latest
    needs: container-build

    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - name: Build image
        timeout-minutes: 10
        run: docker build -t secdev-app:latest .

      - name: Create reports directory
        run: mkdir -p reports

      - name: Run Trivy (image with custom config)
        timeout-minutes: 10
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'secdev-app:latest'
          format: 'sarif'
          output: 'reports/trivy-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          trivyignores: '.trivyignore'

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        continue-on-error: true
        with:
          sarif_file: 'reports/trivy-results.sarif'

      - name: Run Trivy filesystem scan
        timeout-minutes: 5
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: 0
          trivyignores: '.trivyignore'

      - name: Generate Trivy JSON Report
        timeout-minutes: 10
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'secdev-app:latest'
          format: json
          output: reports/trivy-report.json
          trivyignores: '.trivyignore'

      - name: Generate Trivy HTML Report
        timeout-minutes: 5
        continue-on-error: true
        run: |
          trivy image --format template --template '@contrib/gitlab.tpl' -o reports/trivy-report.html secdev-app:latest || true

      - name: Upload Trivy reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-reports
          path: reports/trivy-*.json
          retention-days: 30

      - name: Upload Trivy HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-html-report
          path: reports/trivy-report.html
          retention-days: 30

      - name: Upload security configs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-configs
          path: |
            trivy.yaml
            .trivyignore
            .hadolint.yaml
          retention-days: 30

  container-test:
    name: Container Tests (Runtime checks)
    runs-on: ubuntu-latest
    needs: container-build

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Build image
        timeout-minutes: 10
        run: docker build -t secdev-app:latest .

      - name: Verify non-root user
        timeout-minutes: 2
        run: |
          USER_ID=$(docker run --rm --entrypoint "" secdev-app:latest id -u)
          echo "User ID: $USER_ID"
          if [ "$USER_ID" = "0" ]; then
            echo "❌ Container runs as root!"
            exit 1
          else
            echo "✅ Container runs as non-root (UID=$USER_ID)"
          fi

      - name: Test healthcheck endpoint
        timeout-minutes: 3
        run: |
          docker run -d --name test-container -p 8000:8000 secdev-app:latest
          sleep 10
          curl -f http://localhost:8000/health
          docker stop test-container
          docker rm test-container

  deploy-staging:
    name: Deploy to Staging (Mock)
    runs-on: ubuntu-latest
    needs: [lint, test, container-build, container-scan]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/p08-cicd-minimal'

    permissions:
      contents: read

    environment:
      name: staging
      url: https://staging.example.com

    steps:
      - uses: actions/checkout@v4

      - name: Mock deploy to staging
        timeout-minutes: 5
        run: |
          echo "🚀 Mock deployment to staging environment"
          echo "Environment: staging"
          echo "Image: secdev-app:latest"
          echo "DB_URL configured: ${{ secrets.DB_URL_STAGING != '' && 'yes' || 'no' }}"
          echo "JWT_SECRET configured: ${{ secrets.JWT_SECRET_STAGING != '' && 'yes' || 'no' }}"
          echo ""
          echo "In real scenario, this would:"
          echo "  1. Build and tag Docker image"
          echo "  2. Push to container registry"
          echo "  3. Update Kubernetes deployment"
          echo "  4. Run smoke tests"
          echo ""
          echo "✅ Staging deployment simulation completed"
        env:
          DB_URL: ${{ secrets.DB_URL_STAGING }}
          JWT_SECRET: ${{ secrets.JWT_SECRET_STAGING }}

      - name: Generate deployment report
        run: |
          mkdir -p reports
          cat > reports/deployment-staging.json << EOF
          {
            "environment": "staging",
            "status": "success",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "image": "secdev-app:latest",
            "workflow": "${{ github.workflow }}",
            "run_id": "${{ github.run_id }}"
          }
          EOF

      - name: Upload deployment report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployment-staging-report
          path: reports/deployment-staging.json
          retention-days: 30

  promote-production:
    name: Promote to Production (Mock)
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.ref == 'refs/heads/main'

    permissions:
      contents: read

    environment:
      name: production
      url: https://prod.example.com

    steps:
      - uses: actions/checkout@v4

      - name: Mock promote to production
        timeout-minutes: 5
        run: |
          echo "🚀 Mock promotion to production environment"
          echo "Environment: production"
          echo "Image: secdev-app:latest"
          echo "DB_URL configured: ${{ secrets.DB_URL_PROD != '' && 'yes' || 'no' }}"
          echo "JWT_SECRET configured: ${{ secrets.JWT_SECRET_PROD != '' && 'yes' || 'no' }}"
          echo ""
          echo "In real scenario, this would:"
          echo "  1. Promote staging image to production registry"
          echo "  2. Run production smoke tests"
          echo "  3. Perform blue-green deployment"
          echo "  4. Monitor health checks"
          echo ""
          echo "✅ Production promotion simulation completed"
        env:
          DB_URL: ${{ secrets.DB_URL_PROD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET_PROD }}

      - name: Generate promotion report
        run: |
          mkdir -p reports
          cat > reports/promotion-production.json << EOF
          {
            "environment": "production",
            "status": "success",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "image": "secdev-app:latest",
            "workflow": "${{ github.workflow }}",
            "run_id": "${{ github.run_id }}"
          }
          EOF

      - name: Upload promotion report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: promotion-production-report
          path: reports/promotion-production.json
          retention-days: 30
