title = "Course project gitleaks configuration"

# Adds an allowlist for generated binaries and a couple of targeted patterns;
# keep this small so it complements the default Gitleaks ruleset used by the CLI.

[allowlist]
description = "Skip generated binary upload fixtures that can trigger high-entropy noise."
paths = [
  '''app/uploads/.*\.bin''',
  '''uploads/.*\.bin'''
]

[[rules]]
id = "aws-access-key"
description = "AWS Access Key"
regex = '''AKIA[0-9A-Z]{16}'''
tags = ["key", "aws"]

[[rules]]
id = "generic-credential-assignment"
description = "Generic credential assignment (password/secret/token)"
regex = '''(?i)(password|passwd|api[_-]?key|secret|token|jwt)[\"']?\s*[:=]\s*[\"'][A-Za-z0-9_\-\.]{12,}[\"']'''
tags = ["key", "generic", "credential"]
